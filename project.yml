# XcodeGen spec. The committed LineByLine.xcodeproj can be opened directly,
# but if it ever gets out of sync you can regenerate it with:
#
#     brew install xcodegen
#     xcodegen generate
#
name: LineByLine
options:
  bundleIdPrefix: com.laffan
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LineByLine:
    type: application
    platform: iOS
    sources:
      - Shared
      - LineByLine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laffan.LineByLine
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Line by Line records your reading of a poem so you can listen back to it."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Line by Line uses your location so you can set a cue for where you are standing."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Line by Line watches the places you choose so it can cue you to recall a poem when you arrive or leave, even when the app is closed."
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: LineByLine Watch App
        embed: true

  LineByLine Watch App:
    type: application
    platform: watchOS
    sources:
      - Shared
      - LineByLine Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laffan.LineByLine.watchkitapp
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_WKApplication: "YES"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.laffan.LineByLine
        TARGETED_DEVICE_FAMILY: "4"
